defaults:
    - submitit_slurm

nodes: 1
tasks_per_node: 8
gpus_per_node: 8
cpus_per_task: 12
mem_gb: 1024

timeout_min: 7600
signal_delay_s: 300

qos: cortex_high
account: cortex

name: ${hydra.job.name}
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${hydra.sweep.dir}/.submitit/%j

setup:
 - echo Starting Job!
 - nvidia-smi
 - set -x
